name: Application CI (Build, Scan & Push to ECR)

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "services/worker/**"
      - "services/dashboard/**"
      - ".github/workflows/ci.yaml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  build-scan-push:
    name: Build, Scan & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/shorturl-dev-api:$IMAGE_TAG" \
            ./app

      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/shorturl-dev-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true

      - name: Build Worker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/shorturl-dev-worker:$IMAGE_TAG" \
            ./services/worker

      - name: Scan Worker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/shorturl-dev-worker:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true

      - name: Build Dashboard image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/shorturl-dev-dashboard:$IMAGE_TAG" \
            ./services/dashboard

      - name: Scan Dashboard image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/shorturl-dev-dashboard:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true

      - name: Push images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/shorturl-dev-api:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/shorturl-dev-worker:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/shorturl-dev-dashboard:$IMAGE_TAG"