name: Application CI (Build, Scan & Push to ECR)

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: application-ci-main
  cancel-in-progress: true


permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  detect-changes:
    name: Detect Application Changes
    runs-on: ubuntu-latest

    outputs:
      app_changed: ${{ steps.changes.outputs.app_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect application changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
            | grep -qE '^(app/|services/worker/|services/dashboard/)'; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-scan-push:
    name: Build, Scan & Push ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.app_changed == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: API
            context: ./app
            repository: shorturl-dev-api

          - service: Worker
            context: ./services/worker
            repository: shorturl-dev-worker

          - service: Dashboard
            context: ./services/dashboard
            repository: shorturl-dev-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build ${{ matrix.service }} image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/${{ matrix.repository }}:$IMAGE_TAG" \
            "${{ matrix.context }}"

      - name: Scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true

      - name: Push ${{ matrix.service }} image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/${{ matrix.repository }}:$IMAGE_TAG"

  record-release:
    name: Record Published Release
    needs:
      - detect-changes
      - build-scan-push

    if: |
      always() &&
      needs.detect-changes.outputs.app_changed == 'true' &&
      needs.build-scan-push.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}

      - name: Record published image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ssm put-parameter \
            --name "/shorturl-dev/current-image-tag" \
            --value "$IMAGE_TAG" \
            --type String \
            --overwrite