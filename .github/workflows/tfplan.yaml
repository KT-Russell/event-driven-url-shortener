name: Terraform Plan

on:
  workflow_run:
    workflows:
      - "Application CI (Build, Scan & Push to ECR)"
    types:
      - completed

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  TF_VAR_certificate_domain_name: ${{ vars.CERTIFICATE_DOMAIN_NAME }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

concurrency:
  group: terraform-plan-dev
  cancel-in-progress: true

jobs:
  terraform-plan:
    name: Plan Dev Infrastructure

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_TF_PLAN_ROLE_ARN }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Read published image tag
        shell: bash
        run: |
          IMAGE_TAG=$(aws ssm get-parameter \
            --name "/shorturl-dev/current-image-tag" \
            --query "Parameter.Value" \
            --output text)

          if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "None" ]; then
            echo "No published image tag found in Parameter Store."
            exit 1
          fi

          echo "Using application release: $IMAGE_TAG"
          echo "TF_VAR_image_tag=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Terraform format check
        working-directory: terraform/environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: terraform validate -no-color

      - name: Checkov IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true

      - name: Terraform plan
        working-directory: terraform/environments/dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.workflow_run.head_sha }}
          path: terraform/environments/dev/tfplan
          retention-days: 3
          if-no-files-found: error